services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 2s
      retries: 5

  server:
    build: .
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      # Inside the compose network, storage is the minio service, not localhost.
      S3_ENDPOINT: http://minio:9000
    depends_on:
      minio:
        condition: service_healthy

volumes:
  minio_data:
