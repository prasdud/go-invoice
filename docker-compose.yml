services:
  s3mock:
    image: adobe/s3mock:latest
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/"]
      interval: 2s
      timeout: 2s
      retries: 10

  server:
    build: .
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      # Inside the compose network, storage is the s3mock service, not localhost.
      S3_ENDPOINT: http://s3mock:9090
    depends_on:
      s3mock:
        condition: service_healthy
