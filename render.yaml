# Render blueprint for go-invoice — https://render.com/docs/blueprint-spec
#
# Deploy: Render Dashboard -> New + -> Blueprint -> select this repository.
# Fill the secrets marked `sync: false`, then Apply.
#
# Notes:
# - plan: starter (512 MB, no Chromium workloads). Switch to `standard` (2 GB)
#   if you use the html engine (CJK invoices / html themes): each Chromium tab
#   costs 100-200 MB.
# - BASE_URL is intentionally unset: the service falls back to Render's
#   RENDER_EXTERNAL_URL. Set BASE_URL explicitly only for a custom domain.
services:
  - type: web
    name: go-invoice
    runtime: docker
    plan: starter
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: API_KEY
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: TEMPLATE
        value: default
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_USE_PATH_STYLE
        value: "true"
